name: Build iOS (.ipa, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static site
        run: npm run build:app

      - name: Create and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Bryxy-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bryxy-unsigned-ipa
          path: Bryxy-unsigned.ipa
          retention-days: 30
